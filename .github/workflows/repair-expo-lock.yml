name: Repair Expo Lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade Expo patch and regenerate lockfile
        run: npm install expo@~54.0.37 --save

      - name: Verify Expo compatibility
        run: npx expo install --check

      - name: Commit repaired manifests
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo manifests are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update Expo SDK 54 patch dependencies"
          git push
